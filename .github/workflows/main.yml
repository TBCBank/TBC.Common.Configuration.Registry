# $schema: https://json.schemastore.org/github-workflow.json

name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      DOTNET_DISABLE_GUI_ERRORS: 1
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 0
      DOTNET_NOLOGO: 1
      POWERSHELL_TELEMETRY_OPTOUT: 1
      POWERSHELL_UPDATECHECK: 'Off'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

    steps:

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore -p:Configuration=Release

    - name: Build
      run: dotnet build --no-restore -c Release "-p:SourceRevisionId=$(git rev-parse --short $env:GITHUB_SHA)"

    - name: Test
      run: |
        # Registry tests share a key, so TFMs/modules must run sequentially.
        dotnet test --no-build -c Release --max-parallel-test-modules 1 --verbosity normal
